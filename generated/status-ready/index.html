<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Watch Landing Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 1rem;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #ddd;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            transition: display 0.3s ease;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .product {
            border: 1px solid #ddd;
            padding: 1rem;
            margin: 1rem;
            transition: transform 0.3s ease;
        }
        .product:hover {
            transform: scale(1.05);
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Luxury Watches</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Collections</a>
        <div class="dropdown">
            <a href="#">More</a>
            <div class="dropdown-content">
                <a href="#">About Us</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </nav>
    <section>
        <div class="product">
            <h2>Product 1</h2>
            <img src="product1.jpg" alt="Product 1">
            <p>Description of Product 1</p>
            <p>$1000</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <h2>Product 2</h2>
            <img src="product2.jpg" alt="Product 2">
            <p>Description of Product 2</p>
            <p>$1500</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <h2>Product 3</h2>
            <img src="product3.jpg" alt="Product 3">
            <p>Description of Product 3</p>
            <p>$2000</p>
            <button>Add to Cart</button>
        </div>
    </section>
    <footer>
        <p>&copy; 2023 Luxury Watches</p>
    </footer>
</body>
</html>
