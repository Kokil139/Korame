<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milton Bottle Company</title>
    <style>
        body {
            background-color: #228B22;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Milton Bottle Company</h1>
            <!-- SVG Logo -->
            <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" stroke="white" stroke-width="3" fill="#228B22"/>
                <text x="50" y="60" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="white">M</text>
            </svg>
        </header>
        <main>
            <!-- Bottle Design 1 -->
            <div class="bottle">
                <h2>Bottle Design 1</h2>
                <svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                    <rect x="50" y="50" width="100" height="200" fill="#FFFFFF"/>
                    <circle cx="100" cy="150" r="40" stroke="black" stroke-width="3" fill="#FF6347"/>
                </svg>
            </div>
            <!-- Bottle Design 2 -->
            <div class="bottle">
                <h2>Bottle Design 2</h2>
                <svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                    <rect x="50" y="50" width="100" height="200" fill="#FFFFFF"/>
                    <circle cx="100" cy="150" r="40" stroke="black" stroke-width="3" fill="#87CEEB"/>
                </svg>
            </div>
        </main>
    </div>
</body>
</html>
